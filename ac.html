<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FD4C5B" />
    <title>视频信息 - AcFunPlus</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            background: #f0f2f5;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 主容器 ========== */
        .container {
            width: 100%;
            max-width: 640px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* ========== 头部 ========== */
        .header {
            text-align: center;
            user-select: none;
        }
        .header a {
            text-decoration: none;
            display: inline-block;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            color: #FD4C5B;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(253, 76, 91, 0.18);
            transition: transform 0.2s ease;
        }
        .header a:hover h1 {
            transform: scale(1.03);
        }
        .header a:active h1 {
            transform: scale(0.98);
        }
        .header p {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* ========== 卡片通用 ========== */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            animation: fadeInUp 0.5s ease both;
        }
        @media (hover: hover) and (pointer: fine) {
            .card:hover {
                box-shadow: 0 4px 20px rgba(253, 76, 91, 0.08);
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 加载中卡片 ========== */
        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 220px;
            text-align: center;
        }
        .loading-card p {
            color: #888;
            font-size: 15px;
        }
        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid #ffe0e3;
            border-top-color: #FD4C5B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-steps {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
            min-height: 18px;
        }
        .progress-bar {
            width: 120px;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-bar.active {
            opacity: 1;
        }
        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: #FD4C5B;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ========== 视频信息卡片 ========== */
        .video-card {
            padding: 0;
            overflow: hidden;
        }

        /* 封面 */
        .cover-wrap {
            width: 100%;
            position: relative;
            background: #f0f0f0;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .cover-wrap img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, opacity 0.4s ease;
            opacity: 0;
        }
        .cover-wrap img.loaded {
            opacity: 1;
        }
        @media (hover: hover) and (pointer: fine) {
            .video-card:hover .cover-wrap img.loaded {
                transform: scale(1.02);
            }
        }
        .cover-placeholder {
            color: #ccc;
            font-size: 14px;
            padding: 60px 20px;
            text-align: center;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .cover-placeholder::before {
            content: "(´；ω；`)";
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
            color: #ddd;
        }

        /* 封面链接（点击在新窗口打开大图） */
        .cover-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: inherit;
            cursor: zoom-in;
            text-decoration: none;
            color: inherit;
            line-height: 0;
        }
        .cover-link:hover img.loaded {
            transform: scale(1.02);
            opacity: 0.92;
        }

        /* 视频内容区 */
        .video-body {
            padding: 28px;
        }

        /* Ac号标签 */
        .ac-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FD4C5B, #ff6b7a);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 14px;
            letter-spacing: 1px;
            user-select: all;
        }

        /* 标题 */
        .video-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: break-all;
        }

        /* 信息列表：每条信息一张字段卡 */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
            min-width: 0;
        }
        .info-item .label {
            color: #aaa;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            color: #333;
            font-weight: 500;
            word-break: break-all;
        }
        .info-item .value a {
            color: #FD4C5B;
            text-decoration: none;
            word-break: break-all;
        }
        .info-item .value a:hover {
            text-decoration: underline;
        }
        /* 来源字段卡：值 +「复制链接」并排。只给带链接的字段加这个类，
           其它字段卡仍是普通块级文本，不受影响 */
        .info-item .value.value-with-copy {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .info-item .value.value-with-copy a {
            min-width: 0;
        }
        .copy-link-btn {
            flex: none;
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.3px;
            padding: 4px 9px;
            border-radius: 6px;
            border: 1px solid #f6ccd1;
            background: #fff6f7;
            color: #FD4C5B;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .copy-link-btn:hover {
            background: #FD4C5B;
            border-color: #FD4C5B;
            color: #fff;
        }
        .copy-link-btn.copied {
            background: #2a7d2a;
            border-color: #2a7d2a;
            color: #fff;
        }

        /* ========== 简介 / 数据来源文本块 ========== */
        .section-block {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
        }
        .section-block .section-label {
            font-size: 12px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .section-text {
            position: relative;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
        }
        .section-text.collapsed {
            max-height: calc(5.4em + 30px); /* 3 行 + 上下内边距 + 边框 */
            overflow: hidden;
        }
        .section-text.collapsed::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2.4em;
            border-radius: 0 0 12px 12px;
            background: linear-gradient(rgba(250, 250, 250, 0), #fafafa);
            pointer-events: none;
        }
        .section-toggle {
            align-self: flex-start;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #FD4C5B;
            background: none;
            border: none;
            padding: 2px 0;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            -webkit-appearance: none;
        }
        .section-toggle:hover {
            text-decoration: underline;
        }
        .section-toggle:active {
            opacity: 0.7;
        }

        /* ========== 简介多版本横条 + 简介区 ========== */
        .desc-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .desc-tab {
            font-size: 12px;
            font-weight: 500;
            color: #666;
            background: #f5f5f5;
            border: 1px solid #eee;
            border-radius: 999px;
            padding: 4px 12px;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }
        .desc-tab:hover {
            background: #fff0f1;
            border-color: #ffd0d4;
            color: #FD4C5B;
        }
        .desc-tab.active {
            background: #FD4C5B;
            color: #fff;
            border-color: #FD4C5B;
        }
        .desc-panels {
            position: relative;
        }
        .desc-panel {
            display: none;
            position: relative;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 12px 14px 14px;
        }
        .desc-panel.active {
            display: block;
        }
        .desc-panel .desc-text {
            font-size: 14px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .desc-panel .desc-cache {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #eee;
            text-align: right;
            font-size: 11px;
            color: #999;
        }

        /* ========== 数据来源链接（仿 about.html 的紧凑 link-card） ========== */
        .source-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .source-link {
            display: block;
            padding: 12px 16px;
            font-size: 14px;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            text-decoration: none;
            color: #FD4C5B;
            word-break: break-all;
            overflow-wrap: anywhere;
            line-height: 1.6;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }
        .source-link:hover {
            background: #fff5f6;
            border-color: #FD4C5B;
            transform: translateX(4px);
        }
        .source-link:active {
            transform: translateX(2px);
        }
        .source-link.plain {
            cursor: default;
            color: #555;
        }
        /* 数据来源折叠：超过 MAX_VISIBLE 的条目默认隐藏，点"展开全部"后显示 */
        .source-link.extra {
            display: none;
        }
        .source-list.expanded .source-link.extra {
            display: block;
        }

        /* ========== 分P列表 ========== */
        .parts-block {
            margin-top: 0;
        }
        .parts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .part-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
            min-width: 0;
        }
        .part-index {
            flex-shrink: 0;
            font-weight: 600;
            color: #FD4C5B;
            font-variant-numeric: tabular-nums;
        }
        .part-title {
            color: #333;
            font-weight: 500;
            word-break: break-all;
            min-width: 0;
            flex: 1;
        }
        .part-vids {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            flex-shrink: 0;
        }
        .part-vid {
            font-size: 12px;
            color: #999;
            font-variant-numeric: tabular-nums;
        }
        .part-vid b {
            color: #666;
            font-weight: 500;
        }
        /* 分P 里的来源 id：做成链接，交互与「数据来源」一致（新标签页打开 + hover 下划线） */
        .part-vid a {
            color: #FD4C5B;
            text-decoration: none;
            word-break: break-all;
        }
        .part-vid a:hover {
            text-decoration: underline;
        }
        .part-item.extra {
            display: none;
        }
        .parts-list.expanded .part-item.extra {
            display: flex;
        }
        .source-link.extra {
            display: none;
        }
        .source-list.expanded .source-link.extra {
            display: block;
        }

        /* Tag 标签 */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag-item {
            display: inline-block;
            background: #fff0f1;
            color: #FD4C5B;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid #ffd0d4;
            transition: transform 0.15s ease;
        }
        .tag-item:active {
            transform: scale(0.92);
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #eee, transparent);
            margin: 22px 0;
        }

        /* ========== 数据统计网格 ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 4px;
        }
        .stat-box {
            background: linear-gradient(135deg, #fff5f6 0%, #fff0f1 100%);
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            border: 1px solid #ffe8ea;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
        }
        @media (hover: hover) and (pointer: fine) {
            .stat-box:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(253, 76, 91, 0.1);
            }
        }
        .stat-icon {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #FD4C5B;
        }

        /* ========== UP 主信息卡 ========== */
        .up-block {
            margin: 10px 0 16px;
        }
        .up-card {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 8px 12px;
            background: linear-gradient(135deg, #fff8f9 0%, #fff0f2 100%);
            border-radius: 12px;
            border: 1px solid rgba(253, 76, 91, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .up-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(253, 76, 91, 0.1);
            border-color: rgba(253, 76, 91, 0.3);
        }
        .up-card:active {
            transform: translateY(0);
        }
        .up-card-link {
            display: flex;
            gap: 10px;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .up-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #f0f2f5;
            flex-shrink: 0;
            border: 1.5px solid #fff;
            box-shadow: 0 1px 4px rgba(253, 76, 91, 0.15);
        }
        .up-info {
            flex: 1;
            min-width: 0;
        }
        .up-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .up-name {
            font-size: 14px;
            font-weight: 600;
            color: #FD4C5B;
            text-decoration: none;
        }
        .up-name:hover {
            text-decoration: underline;
        }
        .up-uid {
            font-size: 11px;
            color: #888;
            background: #f5f5f5;
            padding: 1px 6px;
            border-radius: 8px;
        }
        .up-signature {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin: 6px 0 10px;
            word-break: break-word;
        }
        .up-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            font-size: 12px;
            color: #888;
        }
        .up-meta b {
            color: #FD4C5B;
            font-weight: 600;
        }
        .up-loading, .up-empty {
            font-size: 13px;
            color: #999;
            padding: 12px 0;
        }
        .up-error {
            font-size: 12px;
            color: #b8860b;
            background: #fff8e1;
            padding: 6px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        /* ========== 未找到卡片 ========== */
        .not-found-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 64px 32px;
            min-height: 280px;
        }
        .not-found-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 4px;
            user-select: none;
        }
        .not-found-card h3 {
            font-size: 18px;
            color: #666;
            font-weight: 600;
        }
        .not-found-card p {
            font-size: 14px;
            color: #999;
        }

        /* ========== 错误卡片 ========== */
        .error-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 40px 32px;
        }
        .error-card .error-icon {
            font-size: 40px;
            color: #FD4C5B;
            opacity: 0.6;
            user-select: none;
        }
        .error-card h3 {
            font-size: 17px;
            color: #666;
        }
        .error-card p {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
            max-width: 100%;
            word-break: break-all;
        }
        .error-detail {
            font-size: 11px;
            color: #bbb;
            background: #f9f9f9;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 100%;
            word-break: break-all;
            margin-top: 4px;
            font-family: monospace;
        }

        /* ========== 按钮通用 ========== */
        .btn {
            height: 48px;
            padding: 0 36px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            -webkit-appearance: none;
            touch-action: manipulation;
            white-space: nowrap;
            user-select: none;
        }
        .btn-primary {
            background: #FD4C5B;
            color: #fff;
            box-shadow: 0 4px 18px rgba(253, 76, 91, 0.28);
        }
        .btn-primary:hover {
            background: #e54352;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(253, 76, 91, 0.38);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-outline {
            background: transparent;
            color: #FD4C5B;
            border: 2px solid #FD4C5B;
        }
        .btn-outline:hover {
            background: #FD4C5B;
            color: #fff;
        }
        .btn-outline:active {
            transform: scale(0.97);
        }
        .btn-sm {
            height: 44px;
            padding: 0 28px;
            font-size: 14px;
            border-radius: 22px;
        }

        /* ========== 底部 ========== */
        .footer {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 22px;
            border: 2px solid #FD4C5B;
            border-radius: 9999px;
            color: #FD4C5B;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            background: transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .pill-btn:hover {
            background: #FD4C5B;
            color: #fff;
            box-shadow: 0 2px 12px rgba(253, 76, 91, 0.25);
        }
        .pill-btn:active {
            transform: scale(0.94);
        }
        .footer .dot {
            width: 4px;
            height: 4px;
            background: #ddd;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ========== 骨架屏（用于首屏加载） ========== */
        .skeleton {

        /* ========== 响应式 ========== */
        /* 窄屏（手机）：纵向单列流，顺序与旧版一致（封面 → 标题 → 信息 → 简介/来源 → 统计） */
        @media (max-width: 767px) {
            html, body {

            .cover-wrap {

            .info-list { order: -3; }
            .video-detail { order: -2; }
            .divider { order: -1; }

        /* 平板（≥768px）：档案表格式布局 —— 上：标题+双列元信息；下：左（封面+统计）右（简介+来源） */

    <script type="module">
        // ==================== 工具函数 ====================
        const $ = id => document.getElementById(id);

        function setLoading(text, step, progress = -1) {
            $('loadingText').textContent = text;
            $('loadingStep').textContent = step || '';
            const bar = $('progressBar');
            const inner = $('progressBarInner');
            if (progress >= 0) {
                bar.classList.add('active');
                inner.style.width = Math.min(100, Math.max(0, progress)) + '%';
            } else {
                bar.classList.remove('active');
                inner.style.width = '0%';
            }
        }

        function showCard(id) {
            ['loadingCard', 'videoCard', 'notFoundCard', 'errorCard'].forEach(cid => {
                $(cid).style.display = cid === id ? '' : 'none';
            });
        }

        function showError(title, msg, detail = '') {
            $('errorTitle').textContent = title;
            $('errorMsg').textContent = msg;
            const detailEl = $('errorDetail');
            if (detail) {
                detailEl.textContent = detail;
                detailEl.style.display = '';
            } else {
                detailEl.style.display = 'none';
            }
            // 显示重试按钮（如果是可重试的错误）
            const retryBtn = $('retryBtn');
            if (title !== '无效的 Ac 号') {
                retryBtn.style.display = '';
                retryBtn.onclick = () => {
                    retryBtn.style.display = 'none';
                    main();
                };
            } else {
                retryBtn.style.display = 'none';
            }
            showCard('errorCard');
        }

        function formatTime(str) {
            if (!str) return '-';
            const parts = str.split('-');
            if (parts.length === 6) {
                return `${parts[0]}-${parts[1]}-${parts[2]} ${parts[3]}:${parts[4]}:${parts[5]}`;
            }
            return str;
        }

        function formatNumber(num) {
            const n = parseInt(num);
            if (isNaN(n)) return num || '-';
            if (n >= 10000) {
                return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            }
            return n.toLocaleString('zh-CN');
        }

        // ==================== 解析视频数据行 ====================
        function parseVideoLine(line) {
            const data = {};

            // 数据以行内最后一个 ']' 作为结尾，其后内容一律忽略
            const end = line.lastIndexOf(']');
            const body = end === -1 ? line : line.slice(0, end);

            // j（简介）永远是最后一个字段：j= 之后直到结尾 ']' 都属于简介，
            // 中间的 ';'、']'、'[' 都是简介正文，不再起分隔/收尾作用
            let head = body;
            const jMatch = body.match(/(?:^|\[|;)j=/i);
            if (jMatch) {
                const tail = body.slice(jMatch.index + jMatch[0].length).trim();
                if (tail) data.j = tail;
                head = body.slice(0, jMatch.index);
            }

            // 其余字段支持 [key=value; 或 [key=value] 或 key=value; 格式
            // 值可以含 '[' ']'（如 t=[强档]《鬼泣》），行尾定界已由"最后一个 ]"规则处理
            const regex = /\[?([a-z]+)=([^;]*)/gi;
            let match;
            while ((match = regex.exec(head)) !== null) {
                const key = match[1].toLowerCase();
                const val = match[2].trim();
                if (val !== '') {
                    data[key] = val;
                }
            }

            // st（直传）是「无等号的独立标记」：记录里单独放一个 st 即可，出现就
            // 代表该视频是直传（站内直接上传），不写 '='，也不带值。
            //   [i=8;c=2007-06-07;t=xxx;h=...;w=①/xxx;st;j=...]
            //   [i=8;c=2007-06-07;t=xxx;h=...;w=①/xxx;v=641470;st]
            // 早期直传视频没有 vi，用 st 标记来源类型；它与 v/vi/y 是两个维度，可并存。
            // 必须放在 p 解析和「兜底简介」之前：p 的截断只认 ';key='（带等号），
            // st 若跟在 p 后面会被并进 p 的值里；放到最后又会被当成简介正文。
            // 定界只认 ; [ 或行尾，所以字段值里出现的 st（如 t=st）不会被误判。
            const stMatch = head.match(/(?:^|\[|;)(st)(?=;|\[|$)/i);
            if (stMatch) {
                data.st = '1';
                // 连同前面的分隔符一起摘掉，避免在 p 值后面留下多余的 ';;'
                head = head.slice(0, stMatch.index)
                     + head.slice(stMatch.index + stMatch[0].length);
            }

            // p（分P）字段：值为 1@t=第一话@v=641470<v>2@t=第二话 格式。
            // 里面的 @v=、@t= 是分P子字段，不能让上面的正则把它们当顶层字段解析
            // （否则 t/v/y 会被分P的子字段覆盖），所以要先整体摘出再解析。
            const pMatch = head.match(/(?:^|\[|;)p=/i);
            if (pMatch) {
                let pVal = head.slice(pMatch.index + pMatch[0].length).trim();
                // p 是最后一个字段时值直达行尾；否则在下一个 ';key=' 处截断
                const nextField = pVal.match(/;[a-z]+=/i);
                if (nextField) {
                    pVal = pVal.slice(0, nextField.index);
                }
                if (pVal) {
                    data.p = pVal;
                    // 从 head 移除整个 p 字段段，避免子字段污染其他字段
                    head = (head.slice(0, pMatch.index) + (nextField ? pVal.slice(nextField.index).replace(/^;/, ';') : '')).trim();
                }
            }

            // 兜底：数据里没有 j= 时，最后一个键值字段之后的无键名文本段就是简介
            // （简介可以包含 ';'，从尾部往前收集，直到遇到键值字段为止）
            if (!data.j && head) {
                const segs = head.split(';');
                let k = segs.length - 1;
                while (k >= 0 && segs[k].trim() === '') k--;
                const parts = [];
                while (k >= 0 && !/^\[?[a-z]+=/i.test(segs[k].trim())) {
                    parts.unshift(segs[k]);
                    k--;
                }
                if (parts.length > 0) {
                    const intro = parts.join(';').replace(/^\[/, '').trim();
                    if (intro) data.j = intro;
                }
            }
            return data;
        }

        // ==================== 带超时的 fetch ====================
        async function fetchWithTimeout(url, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        // ==================== 数据分片：fetch 文本 + IndexedDB 缓存 + 二分查找 ====================
        // 数据已预排序为纯文本（每行一条记录 [i=编号;...]），无需在浏览器解压 7z / 加载 wasm
        const CHUNK_DB = 'acfunplus-chunks';
        let _idbPromise = null;
        function openChunkDB() {
            if (_idbPromise) return _idbPromise;
            _idbPromise = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) { reject(new Error('浏览器不支持 IndexedDB')); return; }
                const req = indexedDB.open(CHUNK_DB, 2);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    // 升级时若 store 已存在（旧版本建过），先删后建，确保干净空 store
                    if (db.objectStoreNames.contains('chunks')) db.deleteObjectStore('chunks');
                    db.createObjectStore('chunks', { keyPath: 'path' });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return _idbPromise;
        }
        // 缓存自愈：若缓存内容不是合法数据（例如旧版本解压失败留下的乱码），视为未命中，强制重新下载
        function isValidChunk(obj) {
            return obj && typeof obj.text === 'string' && obj.text.indexOf('[i=') !== -1;
        }
        async function getCachedChunk(path) {
            try {
                const db = await openChunkDB();
                const obj = await new Promise((resolve, reject) => {
                    const tx = db.transaction('chunks', 'readonly');
                    const r = tx.objectStore('chunks').get(path);
                    r.onsuccess = () => resolve(r.result || null);
                    r.onerror = () => reject(r.error);
                });
                return isValidChunk(obj) ? obj : null;
            } catch (_) { return null; }
        }
        async function putCachedChunk(path, text, etag) {
            try {
                const db = await openChunkDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction('chunks', 'readwrite');
                    tx.objectStore('chunks').put({ path, text, etag: etag || null });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (_) { /* 缓存失败不影响查询 */ }
        }
        // 按扩展名识别压缩格式，用浏览器原生 DecompressionStream 解压（无需 wasm / 第三方库）
        // 注意：brotli 格式在 DecompressionStream 中的支持度不如 gzip 普遍，本仓库统一用 gzip。
        // 解压失败时直接抛错（交由上层显示错误卡片），不再静默回退成明文导致"查不到"。
        async function decompressBuffer(bytes, path) {
            let fmt = null;
            if (path.endsWith('.br')) fmt = 'brotli';
            else if (path.endsWith('.gz')) fmt = 'gzip';
            if (!fmt) return new TextDecoder('utf-8').decode(bytes); // 明文
            if (typeof DecompressionStream === 'undefined') {
                throw new Error('当前浏览器不支持原生解压（DecompressionStream），无法读取压缩数据分片，请升级浏览器');
            }
            let text;
            try {
                const ds = new DecompressionStream(fmt);
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                text = await new Response(ds.readable).text();
            } catch (e) {
                throw new Error('数据分片解压失败（' + fmt + '）：' + e.message);
            }
            if (text.charCodeAt(0) !== 91) { // 数据行必须以 '[' 开头，否则视为解压异常
                throw new Error('数据分片解压后格式异常（首字符不是 [），可能文件损坏或服务器未正确返回压缩数据');
            }
            return text;
        }
        async function fetchChunkText(path, onProgress) {
            const cached = await getCachedChunk(path);
            const headers = {};
            if (cached && cached.etag) headers['If-None-Match'] = cached.etag;
            const response = await fetchWithTimeout(path, { cache: 'no-cache', headers }, 60000);
            // 数据未变更：直接复用本地缓存（秒开）
            if (response.status === 304 && cached) {
                onProgress && onProgress(85, '命中本地缓存');
                return cached.text;
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            const contentLength = response.headers.get('content-length');
            let text;
            if (contentLength && response.body && response.body.getReader) {
                const total = parseInt(contentLength, 10);
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    const pct = Math.floor((received / total) * 55) + 20; // 20-75%
                    onProgress && onProgress(pct, `${(received / 1024 / 1024).toFixed(1)} MB / ${(total / 1024 / 1024).toFixed(1)} MB`);
                }
                const all = new Uint8Array(received);
                let pos = 0;
                for (const c of chunks) { all.set(c, pos); pos += c.length; }
                text = await decompressBuffer(all, path);
            } else {
                text = await decompressBuffer(new Uint8Array(await response.arrayBuffer()), path);
            }
            onProgress && onProgress(80, '已下载，写入缓存');
            putCachedChunk(path, text, response.headers.get('etag')); // 异步，不阻塞渲染
            return text;
        }
        // 从行首 [i=数字; 提取 ac 号（比正则更快，二分查找每一步都会调用）
        function lineAcValue(line) {
            if (line.length < 4 || line.charCodeAt(0) !== 91) return -1; // 不是 '['
            if (line.charCodeAt(1) !== 105 || line.charCodeAt(2) !== 61) return -1; // 不是 'i='
            let num = 0, i = 3;
            while (i < line.length) {
                const ch = line.charCodeAt(i);
                if (ch < 48 || ch > 57) break;
                num = num * 10 + (ch - 48);
                i++;
            }
            return num;
        }
        // 在已排序的文本分片里二分查找目标 ac 号；未命中再线性兜底（兼容异常数据）
        function searchInText(text, acNum) {
            const lines = text.split(/\r?\n/);
            let lo = 0, hi = lines.length - 1, found = -1;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                const v = lineAcValue(lines[mid]);
                if (v === acNum) { found = mid; break; }
                if (v < acNum) lo = mid + 1; else hi = mid - 1;
            }
            if (found >= 0) return parseVideoLine(lines[found]);
            for (const line of lines) {
                if (lineAcValue(line) === acNum) return parseVideoLine(line);
            }
            return null;
        }

        // ==================== 加载并解析 manifest ====================
        async function loadManifest() {
            const response = await fetchWithTimeout('./manifest.json', { cache: 'no-store' }, 10000);
            if (!response.ok) throw new Error('manifest.json 加载失败: ' + response.status);
            const text = await response.text();
            const entries = [];
            const lines = text.split(/\r?\n/);
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('//')) continue;
                const match = trimmed.match(/^(\d+)-(\d+)=(.+)$/);
                if (match) {
                    entries.push({
                        start: parseInt(match[1], 10),
                        end: parseInt(match[2], 10),
                        path: match[3].trim()
                    });
                }
            }
            entries.sort((a, b) => a.start - b.start);
            return entries;
        }

        function findArchivePath(manifest, acNum) {
            for (const entry of manifest) {
                if (acNum >= entry.start && acNum <= entry.end) {
                    return entry.path;
                }
            }
            return null;
        }

        // ==================== 解压 7z 并搜索数据 ====================
        // 该能力已被下方「fetch 文本 + 二分查找 + IndexedDB 缓存」方案取代（见 searchInText / fetchChunkText），
        // 不再需要在浏览器内加载 libarchive.wasm 解压 7z。

        // ==================== 渲染简介文本块（j 字段） ====================
        // 数据行内用 <v> 表示换行，这里转成真实换行渲染
        function renderTextBlock(blockId, raw) {
            const block = $(blockId);
            const textEl = block.querySelector('.section-text');
            const toggleBtn = block.querySelector('.section-toggle');

            const text = (raw || '').replace(/<v>/gi, '\n').trim();

            if (!text) {
                block.style.display = 'none';
                toggleBtn.style.display = 'none';
                toggleBtn.onclick = null;
                return;
            }

            block.style.display = '';
            textEl.textContent = text;

            // 超过 4 行或 120 字符视为超长，默认折叠为 3 行
            const lineCount = text.split('\n').length;
            const isLong = lineCount > 4 || text.length > 120;

            if (!isLong) {
                textEl.classList.remove('collapsed');
                toggleBtn.style.display = 'none';
                toggleBtn.onclick = null;
                return;
            }

            textEl.classList.add('collapsed');
            toggleBtn.style.display = '';
            toggleBtn.textContent = '展开全部 ▾';
            toggleBtn.onclick = () => {
                const collapsed = textEl.classList.toggle('collapsed');
                toggleBtn.textContent = collapsed ? '展开全部 ▾' : '收起 ▴';
            };
        }

        // ==================== 简介多版本解析（j 字段） ====================
        // j 里的 <v> 历史上被当成两种东西用，靠 <c> 区分：
        //   ① 换行符 —— 存量数据的主流用法（8,700+ 条，且常成对出现 <v><v> 表示空行）。
        //      没有 <c> 时，一律把 <v> 当换行，整体作为「单版本」交给 renderTextBlock。
        //   ② 版本分隔 —— 同一视频被多次抓取、简介改过时才有。出现 <c> 缓存时间标记才启用，
        //      此时 <v> 才是版本分隔符。
        // 这样两种写法都能正确渲染：存量数据不会再把一段简介误拆成「版本1/版本2…」。
        // 例（②）：j=简介1正文<v>简介2正文<c>2024-01-15 10:30<v>简介3正文
        //          → 3 个版本，第 2 版带缓存时间
        function parseDescVersions(raw) {
            if (!raw) return [];
            const s = String(raw);

            // ① 没有 <c>：<v> 就是换行。逐行 trim 后拼回，空行（<v><v>）自然保留。
            if (!/<c>/i.test(s)) {
                const text = s.split(/<v>/gi).map(l => l.trim()).join('\n').trim();
                return text ? [{ text: text, cacheTime: '' }] : [];
            }

            // ② 有 <c>：按 <v> 拆版本，每段内部可能含 <c> 缓存时间
            const versions = [];
            const parts = s.split(/<v>/gi);
            for (const part of parts) {
                const seg = part.trim();
                if (!seg) continue;
                const cIdx = seg.search(/<c>/i);
                if (cIdx >= 0) {
                    versions.push({
                        text: seg.slice(0, cIdx).trim(),
                        cacheTime: seg.slice(cIdx + 3).trim()
                    });
                } else {
                    versions.push({ text: seg, cacheTime: '' });
                }
            }
            return versions;
        }

        // ==================== 渲染简介（支持多版本切换） ====================
        // 单版本（无 <v>）：沿用原 renderTextBlock 行为
        // 多版本：渲染横条列表 + 简介面板，点击横条切换激活的简介
        function renderDescBlock(raw) {
            const versions = parseDescVersions(raw);
            if (versions.length === 0) {
                const block = $('descBlock');
                block.style.display = 'none';
                return;
            }

            // 单版本且无 <c> 缓存时间标记 → 走原 renderTextBlock（多行折叠 + 展开按钮）
            if (versions.length === 1 && !versions[0].cacheTime) {
                renderTextBlock('descBlock', versions[0].text);
                return;
            }

            // 多版本：重写 descBlock 内部结构
            const block = $('descBlock');
            block.innerHTML = `
                <div class="section-label">简介</div>
                <div class="desc-tabs"></div>
                <div class="desc-panels"></div>
            `;
            const tabsEl = block.querySelector('.desc-tabs');
            const panelsEl = block.querySelector('.desc-panels');

            versions.forEach((v, i) => {
                // 横条：显示缓存时间；无缓存时间时显示"版本 N"
                const tabLabel = v.cacheTime || `版本 ${i + 1}`;
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'desc-tab' + (i === 0 ? ' active' : '');
                tab.textContent = tabLabel;
                tab.dataset.idx = String(i);
                tab.onclick = () => {
                    block.querySelectorAll('.desc-tab').forEach(t => t.classList.remove('active'));
                    block.querySelectorAll('.desc-panel').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    block.querySelector(`.desc-panel[data-idx="${i}"]`).classList.add('active');
                };
                tabsEl.appendChild(tab);

                // 简介面板
                const panel = document.createElement('div');
                panel.className = 'desc-panel' + (i === 0 ? ' active' : '');
                panel.dataset.idx = String(i);
                // 右下角：缓存时间（只有当有缓存时间时才显示）
                if (v.cacheTime) {
                    panel.innerHTML = `
                        <div class="desc-text"></div>
                        <div class="desc-cache">缓存时间：${escapeHtml(v.cacheTime)}</div>
                    `;
                    panel.querySelector('.desc-text').textContent = v.text;
                } else {
                    panel.innerHTML = `<div class="desc-text"></div>`;
                    panel.querySelector('.desc-text').textContent = v.text;
                }
                panelsEl.appendChild(panel);
            });

            block.style.display = '';
        }

        // ==================== 代号表（asset/data/link.txt） ====================
        // 代号表按段落隔离：无段头的行归入 [w] 段，[vp] / [p] 段单独存放
        // w 字段只查 [w] 段（前缀替换），vp / p 字段查各自段（整值精确匹配），代号互不串扰
        // 静态 fallback：file:// 协议下 fetch 会被浏览器拒绝，失败时回退到这份硬编码映射
        const LINK_MAP_FALLBACK_TEXT = `①=http://www.acfun.cn/html
②=http://www.acfun.cn/plus
③=https://www.acfun.cn/a
④=http://api.ivideo.sina.com.cn/
⑤=http://124.228.254.229/html
⑥=http://124.228.254.234/html
⑦=http://220.170.79.48/html
⑧=http://220.170.79.105/html
⑨=http://220.170.79.109/html
⑩=http://222.243.146.200/html
✔=https://www.acfun.tv/html
Ⅶ=https://tx-free-imgs.acfun.cn/
×=https://tx-free-imgs.acfun.cn/
[vp]
😋=短篇
😁=动画连载
😂=周刊少年MAD
`;

        function parseLinkMapText(text) {
            const maps = { w: {}, vp: {}, p: {} };
            let section = 'w';
            for (const line of text.split(/\r?\n/)) {
                const t = line.trim();
                if (!t || t.startsWith('#')) continue;
                const sec = t.match(/^\[(\w+)\]$/);
                if (sec) { section = sec[1]; continue; }
                const idx = t.indexOf('=');
                if (idx <= 0) continue;
                const key = t.slice(0, idx).trim().replace(/^\uFEFF/, '');
                const val = t.slice(idx + 1).trim();
                if (key && val && maps[section]) maps[section][key] = val;
            }
            return maps;
        }

        let linkMapPromise = null;
        function getLinkMap() {
            if (!linkMapPromise) {
                linkMapPromise = fetch('asset/data/link.txt')
                    .then(r => r.ok ? r.text() : '')
                    .then(text => text ? parseLinkMapText(text) : parseLinkMapText(LINK_MAP_FALLBACK_TEXT))
                    .catch(() => parseLinkMapText(LINK_MAP_FALLBACK_TEXT));
            }
            return linkMapPromise;
        }

        // pic_link.txt 单独存储：用户数据行 h / si / afp / afm 字段的"数字代号 → 图片 URL"映射
        // 静态 fallback：file:// 协议下 fetch 会被拒绝
        const PIC_LINK_FALLBACK_TEXT = `1=./asset/data/pic/Pill.png
2=./asset/data/pic/defaultAvatar.jpg
3=./asset/data/pic/Default_background.jpg
4=https://imgs.aixifan.com/lXmoRJ67F6-MrQ7Nf-rIVv2a-AZ7j6r-BJJzyq.png
`;

            for (const line of text.split(/\r?\n/)) {
                const t = line.trim();
                if (!t || t.startsWith('#') || t.startsWith('//')) continue;
                if (/^\[\w+\]$/.test(t)) continue;
                const idx = t.indexOf('=');
                if (idx <= 0) continue;
                const key = t.slice(0, idx).trim().replace(/^\uFEFF/, '');
                const val = t.slice(idx + 1).trim();
                if (key && val) map[key] = val;

        }

        let picLinkMapPromise = null;
        function getPicLinkMap() {
            if (!picLinkMapPromise) {
                picLinkMapPromise = fetch('asset/data/pic_link.txt')
                    .then(r => r.ok ? r.text() : '')
                    .then(text => text ? parsePicLinkText(text) : parsePicLinkText(PIC_LINK_FALLBACK_TEXT))
                    .catch(() => parsePicLinkText(PIC_LINK_FALLBACK_TEXT));

        // 解析用户数据中的图片字段：数字 → URL；非数字直接返回原值
        async function resolvePicValue(raw, picMap) {
            if (!raw) return '';
            if (picMap[raw]) return picMap[raw];
            return raw; // 非数字（URL）原样返回
        }

        // 把条目开头的代号替换成 link.txt 里的前缀 URL（如 ①/jhua/1.html → http://www.acfun.cn/html/jhua/1.html）
        function resolveSourceEntry(entry, linkMap) {
            let best = null;
            for (const key of Object.keys(linkMap)) {
                if (entry.startsWith(key) && (!best || key.length > best.length)) best = key;
            }
            return best ? linkMap[best] + entry.slice(best.length) : entry;
        }

        // ==================== 来源字段 → 该源站视频页 URL ====================
        // 写法约定：来源字段的值只存「该站自己的 id」，不存整条 URL；跳转地址由下面的模板拼出。
        //   y    优酷vid    → https://v.youku.com/v_show/id_{id}.html
        //   qq   腾讯源     → https://v.qq.com/x/page/{id}.html
        //   yt   YouTube源  → https://www.youtube.com/watch?v={id}
        //   nico nico源     → https://www.nicovideo.jp/watch/{id}
        //   lin  其他源     → 值本身就是完整链接，直接当 href 用
        //   td   土豆源     → 土豆无可用详情页，只显示 id，不挂链接
        //   v / vi / st     → 同样没有可跳转的视频页模板，按纯文本展示
        // 返回 null = 该字段不生成超链接。
        function sourceFieldUrl(key, value) {
            const v = String(value == null ? '' : value).trim();
            if (!v) return null;
            switch (String(key || '').toLowerCase()) {
                case 'y':
                    return 'https://v.youku.com/v_show/id_' + v + '.html';
                case 'qq':
                    return 'https://v.qq.com/x/page/' + v + '.html';
                case 'yt':
                    return 'https://www.youtube.com/watch?v=' + v;
                case 'nico':
                    // nico 的 watch 号带 sm 前缀；只写了纯数字时补上（早期号段）
                    return 'https://www.nicovideo.jp/watch/' + (/^\d+$/.test(v) ? 'sm' + v : v);
                case 'lin':
                    // 其他源存的就是链接本身（无协议时补 https://）
                    if (/^(https?:\/\/|mailto:)/i.test(v)) return v;
                    return /^[^\s/@]+\.[^\s/@]+/.test(v) ? 'https://' + v : null;
                default:
                    // 含 td（土豆）：只显示 id，不生成链接
                    return null;
            }
        }

        // 把值渲染成「数据来源」那种可点链接（形状同 .source-link 的交互：新标签页打开）
        function makeValueLink(url, text) {

            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = text;

        // 复制文本到剪贴板：优先 Clipboard API；非安全上下文（file:// 打开）会抛错，
        // 退回到临时 textarea + execCommand 的老办法。
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
                ta.remove();
                return ok;
            }
        }

        // 「复制链接」按钮：复制的是**跳转地址**（不是卡里显示的 id），
        // 点完短暂变成「已复制」再复原。只有能拼出链接的来源字段才会挂这个按钮。
        function makeCopyLinkBtn(url) {

        // ==================== 渲染数据来源链接列表（w 字段） ====================

        async function renderSourceBlock(raw) {

        // ==================== 渲染分P列表 ====================
        function renderPartsBlock(pVal) {
            const block = $('partsBlock');
            const list = block.querySelector('.parts-list');
            list.innerHTML = '';
            if (!pVal) {
                block.style.display = 'none';
                return;
            }

            // 分P条目：1@t=第一话@v=641470<v>2@t=第二话@y=XM123
            const parts = pVal.split('<v>').map(s => s.trim()).filter(Boolean);
            block.querySelector('.parts-count').textContent = parts.length;
            block.style.display = '';
            list.classList.remove('expanded');

            const toggleBtn = block.querySelector('.parts-toggle');
            const MAX_PARTS = 6;

            // 子字段名 → 显示名。st 是无值标记（直传），只显示名字不带值
            const subLabels = {
                v: '新浪', vi: 'AcFun', y: '优酷', td: '土豆', c: '投稿', h: '缓存',
                qq: '腾讯', yt: 'YouTube', nico: 'nico', lin: '其他', st: '直传'
            };
            const FLAG_SUBS = { st: true };

            parts.forEach((raw, idx) => {
                const item = document.createElement('div');
                item.className = 'part-item' + (idx >= MAX_PARTS ? ' extra' : '');

                // @st（无等号）是分P级的直传标记：先摘出来，避免它被当成标题或
                // 混进相邻子字段的值。定界只认 @ 或行尾，所以 @stop 之类不会误判。
                let partSt = false;
                const stm = /@st(?=@|$)/i.exec(raw);
                if (stm) {
                    partSt = true;
                    raw = raw.slice(0, stm.index) + raw.slice(stm.index + stm[0].length);
                }

                // 子字段分隔符只认 '@key=' 形态；'@' 后面不是 '字母=' 的属于正文
                // （标题可含 @，如邮箱 a@b.com）
                const sub = {};
                if (partSt) sub.st = '1';
                let indexPart, rest;

                if (/^[a-z]+=/i.test(raw)) {
                    // 以 key= 开头：无序号，整段都是子字段
                    indexPart = String(idx + 1);
                    rest = raw;
                } else {
                    const sepMatch = raw.match(/@[a-z]+=/i);
                    if (sepMatch) {
                        // 有子字段：分隔符前是序号（可空，空则自动编号）
                        indexPart = raw.slice(0, sepMatch.index).trim() || String(idx + 1);
                        rest = raw.slice(sepMatch.index + 1);
                    } else {
                        // 简写：'数字@标题'、纯数字序号、或 '标题'（标题可含 @）
                        const atIdx = raw.indexOf('@');
                        if (atIdx > 0 && /^\d+$/.test(raw.slice(0, atIdx).trim())) {
                            indexPart = raw.slice(0, atIdx).trim();
                            rest = raw.slice(atIdx + 1);
                        } else if (/^\d+$/.test(raw.trim())) {
                            indexPart = raw.trim();
                            rest = '';
                        } else {
                            indexPart = String(idx + 1);
                            rest = raw;
                        }
                        if (rest.trim()) sub.t = rest.trim();
                    }
                }

                if (rest && /^[a-z]+=/i.test(rest)) {
                    // 子字段的值一直取到下一个 '@key=' 为止，中间的 '@' 都是正文
                    const subRegex = /([a-z]+)=((?:(?!@[a-z]+=).)*)/gi;
                    let m;
                    while ((m = subRegex.exec(rest)) !== null) {
                        const k = m[1].toLowerCase();
                        const v = m[2].trim();
                        if (v) sub[k] = v;
                    }
                }

                item.innerHTML = `
                    <span class="part-index"></span>
                    <span class="part-title"></span>
                    <span class="part-vids"></span>
                `;
                item.querySelector('.part-index').textContent = 'P' + indexPart;
                item.querySelector('.part-title').textContent = sub.t || '无标题';
                const vids = item.querySelector('.part-vids');
                for (const [k, label] of Object.entries(subLabels)) {
                    if (sub[k]) {
                        const s = document.createElement('span');
                        s.className = 'part-vid';
                        const b = document.createElement('b');
                        b.textContent = label;
                        s.appendChild(b);
                        // st 是无值标记，只显示「直传」，不追加值
                        if (!FLAG_SUBS[k]) {
                            // 来源类子字段：能拼出视频页的（y/qq/yt/nico/lin）渲染成超链接，
                            // td（土豆）与 v/vi 无模板，退化为纯文本
                            const partHref = sourceFieldUrl(k, sub[k]);
                            s.appendChild(document.createTextNode(' '));
                            if (partHref) s.appendChild(makeValueLink(partHref, sub[k]));
                            else s.appendChild(document.createTextNode(sub[k]));
                            s.title = sub[k];
                        } else {
                            s.title = label;
                        }
                        vids.appendChild(s);
                    }
                }
                list.appendChild(item);
            });

            if (parts.length > MAX_PARTS) {
                toggleBtn.style.display = '';
                toggleBtn.textContent = `展开全部（共 ${parts.length} P） ▾`;
                toggleBtn.onclick = () => {
                    const expanded = list.classList.toggle('expanded');
                    toggleBtn.textContent = expanded ? '收起 ▴' : `展开全部（共 ${parts.length} P） ▾`;
                };
            } else {
                toggleBtn.style.display = 'none';
                toggleBtn.onclick = null;
            }
        }

        // ==================== 加载用户数据 ====================
        // 用户数据文件为明文 txt（asset/data/user/X-XXX.txt），通过 umanifest.json
        // 索引定位 [start-end] 区间对应的文件路径，按行扫描匹配 [u=UID;...]
        let userManifestPromise = null;
        function loadUserManifest() {
            if (!userManifestPromise) {
                userManifestPromise = fetch('./asset/data/umanifest.json', { cache: 'no-store' })
                    .then(r => r.ok ? r.text() : '')
                    .then(text => {
                        const entries = [];
                        for (const line of text.split(/\r?\n/)) {
                            const t = line.trim().replace(/^\uFEFF/, '');
                            if (!t || t.startsWith('#') || t.startsWith('//')) continue;
                            const m = t.match(/^(\d+)-(\d+)=(.+)$/);
                            if (m) {
                                entries.push({
                                    start: parseInt(m[1], 10),
                                    end: parseInt(m[2], 10),
                                    path: m[3].trim()
                                });
                            }
                        }
                        entries.sort((a, b) => a.start - b.start);
                        return entries;
                    })
                    .catch(() => []);
            }
            return userManifestPromise;
        }

        function findUserArchivePath(manifest, uid) {
            for (const entry of manifest) {
                if (uid >= entry.start && uid <= entry.end) return entry.path;
            }
            return null;
        }

        // 用户数据行解析：单行 [u=4;n=熊猫;...;v=0&1&2&3]
        // 与视频行解析规则一致——以最后一个 ']' 作为结尾；'u=' 是第一个字段，
        // 'v=' 的值可能含 '&' 不能用 ';' 截断，所以也按整段切到 ']' 为止
        function parseUserLine(line) {
            const data = {};
            const end = line.lastIndexOf(']');
            const body = end === -1 ? line : line.slice(0, end);

            // 先把 u 字段整体切下来（u 是首字段）
            const uMatch = body.match(/^\[?u=(\d+)/i);
            if (uMatch) data.u = uMatch[1];

            // 再扫剩余字段（除 u 外）
            const regex = /\[?([a-z]+)=([^;\]]*)/gi;
            let m;
            while ((m = regex.exec(body)) !== null) {
                const key = m[1].toLowerCase();
                if (key === 'u') continue; // 已经处理过
                const val = m[2].trim();
                if (val !== '') data[key] = val;
            }
            return data;
        }

        // 加载单个用户 txt 并匹配给定 UID
        async function loadUserData(uid) {
            const manifest = await loadUserManifest();
            if (manifest.length === 0) return { error: 'umanifest.json 为空或加载失败' };

            const path = findUserArchivePath(manifest, uid);
            if (!path) return { error: `UID ${uid} 不在索引范围内` };

            let text;
            try {
                const res = await fetchWithTimeout('./' + path.replace(/^\.?\//, ''), { cache: 'no-store' }, 15000);
                if (!res.ok) return { error: `用户数据文件加载失败: HTTP ${res.status}` };
                text = await res.text();
            } catch (e) {
                return { error: `用户数据文件请求失败: ${e.message}` };
            }

            const lines = text.split(/\r?\n/);
            for (const line of lines) {
                const t = line.trim();
                if (!t) continue;
                const m = t.match(/^\[u=(\d+)/i);
                if (m && parseInt(m[1], 10) === uid) {
                    return { data: parseUserLine(t) };
                }
            }
            return { error: `未找到 UID ${uid} 的记录` };
        }

        // ==================== 渲染 UP 主信息卡 ====================
        // uVal：来自视频数据行的 u 字段（如 "4" 或 "4;熊猫"——后者兜底显示用）
        async function renderUserBlock(uVal) {
            const block = $('upBlock');
            const card = $('upCard');
            card.innerHTML = '';
            block.style.display = 'none';

            if (!uVal) return;

            // u 字段可能是纯 UID（如 "4"）也可能是 "uid;昵称" 兼容写法
            const segs = uVal.split(';').map(s => s.trim());
            const uid = parseInt(segs[0], 10);
            if (!uid || isNaN(uid)) {
                card.innerHTML = `<div class="up-empty">UP 主 UID 无效（u=${escapeHtml(uVal)}）</div>`;
                block.style.display = '';
                return;
            }

            // 先显示加载态
            card.innerHTML = `<div class="up-loading">正在加载 UP 主信息（UID ${uid}）...</div>`;
            block.style.display = '';

            const result = await loadUserData(uid);
            if (result.error) {
                card.innerHTML = `<div class="up-error">⚠ ${escapeHtml(result.error)}</div>`;
                return;
            }

            const u = result.data;
            const nickname = u.n || segs[1] || `UID ${uid}`;
            const DEFAULT_AVATAR = './asset/data/pic/defaultAvatar.jpg';
            // ac.html 仅展示头像+昵称，详细界面在 user.html
            const homeUrl = `./user.html?uid=${uid}`;

            // 数字代号 → URL：h / afp / afm 在 pic_link.txt 里查表
            const picMap = await getPicLinkMap();
            const avatarUrl = await resolvePicValue(u.h || '', picMap) || DEFAULT_AVATAR;

            card.innerHTML = `
                <a class="up-card-link" href="${escapeAttr(homeUrl)}" title="查看 ${escapeAttr(nickname)} 的详细信息">
                    <img class="up-avatar" src="${escapeAttr(avatarUrl)}" alt="${escapeAttr(nickname)}的头像"
                         onerror="this.onerror=null;this.src='${escapeAttr(DEFAULT_AVATAR)}'" />
                    <div class="up-info">
                        <div class="up-name-row">
                            <span class="up-name">${escapeHtml(nickname)}</span>
                            <span class="up-uid">UID ${uid}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        // HTML 转义工具
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function escapeAttr(str) {
            return escapeHtml(str);
        }

        // ==================== 渲染视频信息 ====================
        async function renderVideoInfo(data, acNum) {
            $('acBadge').textContent = 'ac' + acNum;

            $('videoTitle').textContent = data.t || '无标题';

            // 封面（cl 字段：link.txt [w] 段里的代号前缀替换，如 ×/Ⅶ→https://tx-free-imgs.acfun.cn/）
            const coverImg = $('coverImg');
            const coverPlaceholder = $('coverPlaceholder');
            const coverLink = $('coverLink');
            const linkMap = await getLinkMap();
            const clRaw = data.cl || '';
            const clResolved = clRaw ? resolveSourceEntry(clRaw, linkMap.w) : '';
            if (clResolved) {
                coverLink.href = clResolved;
                coverLink.style.display = '';  // 用 CSS 的 .cover-link 默认 flex
                coverImg.src = clResolved;
                coverImg.style.display = '';
                coverPlaceholder.style.display = 'none';
                coverImg.classList.remove('loaded');
                coverImg.onload = () => coverImg.classList.add('loaded');
                coverImg.onerror = () => {
                    coverImg.style.display = 'none';
                    coverLink.style.display = 'none';
                    coverPlaceholder.style.display = '';
                    coverPlaceholder.textContent = '封面加载失败';
                };
            } else {
                coverLink.style.display = 'none';
                coverImg.style.display = 'none';
                coverPlaceholder.style.display = '';
                coverPlaceholder.textContent = '暂无封面';
            }

            // 构建信息列表
            const infoList = $('infoList');
            infoList.innerHTML = '';

            // 视频分区（vp）：整值作为代号查 link.txt 的 [vp] 段（如 vp=😋 且 [vp] 里 😋=动画 → 显示"动画"）
            let vpValue = data.vp || '';
            if (vpValue) {
                const vpMap = (await getLinkMap()).vp;
                if (vpMap[vpValue]) vpValue = vpMap[vpValue];
            }

            const items = [
                { key: 'i', label: 'Ac号', value: 'ac' + acNum, always: true },
                { key: 'c', label: '投稿时间', value: formatTime(data.c), hideIfEmpty: true },
                { key: 'h', label: '缓存信息', value: formatTime(data.h), hideIfEmpty: true },
                // 来源字段族（带 link:true 的会把「id」渲染成超链接，URL 模板见 sourceFieldUrl）：
                //   ① 历史 vid 字段（现有数据在用的）：v=新浪vid、vi=AcFun vid、
                //      y=优酷vid（即「优酷源」，历史命名，沿用不改）→ v.youku.com/v_show/id_{id}.html
                //   ② 按源站划分的来源字段（值只存该站 id，不存整条 URL）：
                //      td=土豆源   → 土豆无可跳转详情页，只显示 id（不加 link:true）
                //      qq=腾讯源   → v.qq.com/x/page/{id}.html
                //      yt=YouTube源 → youtube.com/watch?v={id}
                //      nico=nico源  → nicovideo.jp/watch/{id}
                //      lin=其他源   → 值本身就是完整链接（直接当 href）
                //   另外 st=直传源 是「无等号标记」，不赋值，单独写一个 st 即代表直传
                { key: 'v', label: '新浪vid', value: data.v, hideIfEmpty: true },
                { key: 'vi', label: 'AcFun vid', value: data.vi, hideIfEmpty: true },
                { key: 'y', label: '优酷vid', value: data.y, hideIfEmpty: true, link: true },
                { key: 'td', label: '土豆源', value: data.td, hideIfEmpty: true },
                { key: 'st', label: '直传源', value: data.st ? '是' : '', hideIfEmpty: true },
                { key: 'qq', label: '腾讯源', value: data.qq, hideIfEmpty: true, link: true },
                { key: 'yt', label: 'YouTube源', value: data.yt, hideIfEmpty: true, link: true },
                { key: 'nico', label: 'nico源', value: data.nico, hideIfEmpty: true, link: true },
                { key: 'lin', label: '其他源', value: data.lin, hideIfEmpty: true, link: true },
                { key: 'vp', label: '视频分区', value: vpValue, hideIfEmpty: true },
            ];

            if (clResolved) {
                items.push({
                    key: 'cl',
                    label: '封面链接',
                    value: `<a href="${clResolved}" target="_blank" rel="noopener noreferrer">${clResolved}</a>`,
                    isHtml: true
                });
            }

            for (const item of items) {
                if (item.hideIfEmpty && !item.value) continue;
                const div = document.createElement('div');
                div.className = 'info-item';
                const labelEl = document.createElement('span');
                labelEl.className = 'label';
                labelEl.textContent = item.label;
                const valEl = document.createElement('span');
                valEl.className = 'value';
                // 来源字段（link:true）：id 本身是超链接，点一下跳该源站视频页；
                // 能拼出链接的再补一个「复制链接」按钮（复制的是跳转地址）
                const href = item.link ? sourceFieldUrl(item.key, item.value) : null;
                if (item.isHtml) {
                    valEl.innerHTML = item.value;
                } else if (href) {
                    valEl.classList.add('value-with-copy');
                    valEl.appendChild(makeValueLink(href, item.value));
                    valEl.appendChild(makeCopyLinkBtn(href));
                } else {
                    valEl.textContent = item.value || '-';
                }
                div.appendChild(labelEl);
                div.appendChild(valEl);
                infoList.appendChild(div);
            }

            // 简介（j）与数据来源（w）
            renderDescBlock(data.j);
            await renderSourceBlock(data.w);

            // 分P列表（p）
            renderPartsBlock(data.p);

            // UP 主信息（u 字段，异步加载，不阻塞主流程）
            renderUserBlock(data.u);

            // Tag
            if (data.ta) {
                const tags = data.ta.split(/[,，]/).map(t => t.trim()).filter(t => t);
                if (tags.length > 0) {
                    const tagDiv = document.createElement('div');
                    tagDiv.className = 'info-item tag-row';
                    tagDiv.innerHTML = `<span class="label">Tag</span><div class="tag-list"></div>`;
                    const tagList = tagDiv.querySelector('.tag-list');
                    for (const tag of tags) {
                        const span = document.createElement('span');
                        span.className = 'tag-item';
                        span.textContent = tag;
                        tagList.appendChild(span);
                    }
                    infoList.appendChild(tagDiv);
                }
            }

            // 数据统计
            const statsGrid = $('statsGrid');
            statsGrid.innerHTML = '';

            const stats = [
                { key: 'pl', label: '播放', icon: '▶' },
                { key: 'd', label: '弹幕', icon: '💬' },
                { key: 'b', label: '香蕉', icon: '🍌' },
                { key: 'co', label: '收藏', icon: '⭐' },
            ];

            for (const stat of stats) {
                const val = data[stat.key];
                if (!val) continue;
                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <div class="stat-icon">${stat.icon}</div>
                    <div class="stat-label">${stat.label}</div>
                    <div class="stat-value">${formatNumber(val)}</div>
                `;
                statsGrid.appendChild(box);
            }

            showCard('videoCard');
        }

        // ==================== 主流程 ====================
        async function main() {
            try {
                const params = new URLSearchParams(window.location.search);
                const acStr = params.get('ac');

                if (!acStr || !/^\d+$/.test(acStr)) {
                    showError('无效的 Ac 号', '请在首页输入正确的数字 Ac 号');
                    return;
                }

                const acNum = parseInt(acStr, 10);
                showCard('loadingCard');
                setLoading('正在加载索引...', '读取 manifest.json', 10);

                // 提前并行加载来源代号表，渲染时直接使用
                getLinkMap();

                let manifest;
                try {
                    manifest = await loadManifest();
                } catch (e) {
                    showError('索引加载失败', e.message);
                    return;
                }

                if (manifest.length === 0) {
                    showError('索引为空', 'manifest.json 中没有有效的数据范围');
                    return;
                }

                const archivePath = findArchivePath(manifest, acNum);
                if (!archivePath) {
                    showCard('notFoundCard');
                    return;
                }

                setLoading('正在加载数据分片...', archivePath, 20);
                let videoData;
                try {
                    const text = await fetchChunkText(archivePath, (pct, msg) => setLoading('正在加载数据分片...', msg, pct));
                    setLoading('正在查找视频信息...', '二分查找', 80);
                    videoData = searchInText(text, acNum);
                } catch (e) {
                    console.error(e);
                    showError('数据加载或解析失败', e.message, '请检查网络，或数据分片文件是否完整');
                    return;
                }

                if (videoData) {
                    await renderVideoInfo(videoData, acNum);
                } else {
                    showCard('notFoundCard');
                }

            } catch (e) {
                console.error(e);
                showError('未知错误', e.message, e.stack || '');
            }
        }

        // 启动
        main();
    </script>
</body>
