<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AcfunPlus - 认真你就输啦 (・ω・)ノ- ( ゜- ゜)つロ</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 520px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        /* 头部 */
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 800;
            color: #FD4C5B;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(253, 76, 91, 0.18);
        }
        .header p {
            font-size: 15px;
            color: #888;
            margin-top: 14px;
            letter-spacing: 1px;
        }

        /* 卡片 */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(253, 76, 91, 0.08);
        }

        /* 搜索区域 */
        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* 输入框 */
        .input-wrap {
            position: relative;
            width: 100%;
        }
        .input-wrap .ac-prefix {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #FD4C5B;
            font-size: 17px;
            font-weight: 700;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            height: 54px;
            padding-left: 48px;
            padding-right: 24px;
            border: 2.5px solid #FD4C5B;
            border-radius: 27px;
            font-size: 17px;
            outline: none;
            color: #333;
            background: #fafafa;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        .input-wrap input:focus {
            background: #fff;
            box-shadow: 0 0 0 5px rgba(253, 76, 91, 0.12);
        }
        .input-wrap input::placeholder {
            color: #ccc;
        }

        /* 按钮通用 */
        .btn {
            height: 52px;
            padding: 0 48px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            -webkit-appearance: none;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-primary {
            background: #FD4C5B;
            color: #fff;
            box-shadow: 0 4px 18px rgba(253, 76, 91, 0.28);
        }
        .btn-primary:hover {
            background: #e54352;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(253, 76, 91, 0.38);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        /* ========== 底部 ========== */
        .footer {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* 椭圆框按钮（版本号 & 关于） */
        .pill-btn {
            display: inline-block;
            padding: 6px 20px;
            border: 2px solid #FD4C5B;
            border-radius: 9999px;
            color: #FD4C5B;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            background: transparent;
            line-height: 1.5;
            transition: all 0.25s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .pill-btn:hover {
            background: #FD4C5B;
            color: #fff;
            box-shadow: 0 2px 12px rgba(253, 76, 91, 0.25);
        }
        .pill-btn:active {
            transform: scale(0.94);
        }

        /* 分隔圆点 */
        .footer .dot {
            width: 4px;
            height: 4px;
            background: #ddd;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ========== 响应式 ========== */

        /* 电脑端 */
        @media (min-width: 1024px) {
            .container {
                max-width: 560px;
                gap: 44px;
            }
            .header h1 {
                font-size: 48px;
            }
            .header p {
                font-size: 16px;
            }
            .card {
                padding: 44px 40px;
                border-radius: 24px;
            }
            .input-wrap input {
                height: 58px;
                font-size: 18px;
                border-radius: 29px;
            }
            .btn {
                height: 54px;
                font-size: 17px;
            }
            .pill-btn {
                padding: 7px 24px;
                font-size: 14px;
            }
        }

        /* 手机端 */
        @media (max-width: 480px) {
            body {
                background: #ffffff;
            }
            .container {
                padding: 0 20px;
                gap: 28px;
            }
            .header h1 {
                font-size: 36px;
                letter-spacing: 2px;
            }
            .header p {
                font-size: 13px;
                margin-top: 10px;
            }
            .card {
                padding: 28px 24px;
                border-radius: 18px;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.05);
            }
            .input-wrap input {
                height: 52px;
                font-size: 16px;
                border-radius: 26px;
            }
            .btn {
                width: 100%;
                height: 50px;
                font-size: 16px;
            }
            .footer {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .pill-btn {
                padding: 5px 16px;
                font-size: 12px;
                border-width: 1.8px;
            }
        }

        /* 小屏手机 */
        @media (max-width: 360px) {
            .header h1 {
                font-size: 30px;
            }
            .header p {
                font-size: 12px;
            }
            .pill-btn {
                padding: 4px 12px;
                font-size: 11px;
            }
            .footer {
                gap: 10px;
            }
        }
    </style>
    <base target="_blank" />
<base target="_blank">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>AcfunPlus</h1>
            <p>认真你就输啦 (・ω・)ノ- ( ゜- ゜)つロ</p>
        </div>
        <div class="card">
            <div class="search-area">
                <div class="input-wrap">
                    <span class="ac-prefix">ac</span>
                    <input type="text" id="acInput" placeholder="请输入ac号" maxlength="10" autocomplete="off" inputmode="numeric" />
                </div>
                <button class="btn btn-primary" id="goBtn" style="width:100%;">前往</button>
            </div>
        </div>
        <div class="footer">
            <a href="./version.html" class="pill-btn">v0.0.1</a>
            <span class="dot"></span>
            <a href="./about.html" class="pill-btn">关于</a>
        </div>
    </div>

    <script>
        const input = document.getElementById('acInput');
        const goBtn = document.getElementById('goBtn');
        input.addEventListener('input', function(e) {
            let val = this.value;
            val = val.replace(/[^0-9acAC]/g, '');
            if (val.length > 10) val = val.slice(0, 10);
            this.value = val;
        });
        input.addEventListener('paste', function(e) {
            e.preventDefault();
            let paste = (e.clipboardData || window.clipboardData).getData('text');
            paste = paste.replace(/ac/gi, '');
            paste = paste.replace(/[^0-9]/g, '');
            if (paste.length > 10) paste = paste.slice(0, 10);

            const start = this.selectionStart;
            const end = this.selectionEnd;
            const current = this.value;
            const before = current.substring(0, start);
            const after = current.substring(end);
            let newVal = before + paste + after;
            newVal = newVal.replace(/[^0-9]/g, '');
            if (newVal.length > 10) newVal = newVal.slice(0, 10);
            this.value = newVal;
        });
        input.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key.length === 1) {
                const allowed = /[0-9acAC]/;
                if (!allowed.test(e.key)) {
                    e.preventDefault();
                }
            }
        });
        goBtn.addEventListener('click', function() {
            const val = input.value.replace(/[^0-9]/g, '');
            if (!val) {
                input.focus();
                input.style.boxShadow = '0 0 0 5px rgba(253, 76, 91, 0.25)';
                setTimeout(() => { input.style.boxShadow = ''; }, 600);
                return;
            }
            window.location.href = './ac.html?ac=' + val;
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') goBtn.click();
        });
    </script>
</body>
</html>
