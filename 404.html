<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - 页面不见了 | AcfunPlus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 520px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 36px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(253, 76, 91, 0.08);
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #FD4C5B;
            line-height: 1;
            letter-spacing: 6px;
            text-shadow: 5px 5px 0px rgba(253, 76, 91, 0.12);
            position: relative;
        }
        .error-code::after {
            content: '404';
            position: absolute;
            left: 5px;
            top: 5px;
            color: rgba(253, 76, 91, 0.06);
            z-index: -1;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #444;
        }
        .desc {
            font-size: 15px;
            color: #888;
            line-height: 1.8;
            max-width: 380px;
        }
        .desc .highlight {
            color: #FD4C5B;
            font-weight: 600;
        }
        .btn {
            height: 52px;
            padding: 0 40px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            -webkit-appearance: none;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-primary {
            background: #FD4C5B;
            color: #fff;
            box-shadow: 0 4px 18px rgba(253, 76, 91, 0.28);
        }
        .btn-primary:hover {
            background: #e54352;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(253, 76, 91, 0.38);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .footer {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer a {
            color: #bbb;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: #FD4C5B;
        }
        .footer .dot {
            width: 4px;
            height: 4px;
            background: #ddd;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .footer .version {
            font-size: 13px;
            color: #bbb;
        }
        .footer .copyright {
            font-size: 13px;
            color: #bbb;
        }

        /* 电脑端 */
        @media (min-width: 1024px) {
            .container {
                max-width: 560px;
                gap: 44px;
            }
            .card {
                padding: 56px 44px;
                border-radius: 24px;
            }
            .error-code {
                font-size: 140px;
            }
            .emoji {
                font-size: 56px;
            }
            .title {
                font-size: 26px;
            }
            .desc {
                font-size: 16px;
                max-width: 420px;
            }
            .btn {
                height: 54px;
                font-size: 17px;
                padding: 0 48px;
            }
        }

        /* 手机端 */
        @media (max-width: 480px) {
            body {
                background: #ffffff;
            }
            .container {
                padding: 0 20px;
                gap: 28px;
            }
            .card {
                padding: 36px 24px;
                border-radius: 18px;
                box-shadow: 0 1px 8px rgba(0,0,0,0.05);
                gap: 22px;
            }
            .error-code {
                font-size: 90px;
                letter-spacing: 4px;
            }
            .emoji {
                font-size: 44px;
            }
            .title {
                font-size: 20px;
            }
            .desc {
                font-size: 14px;
                max-width: 300px;
            }
            .btn {
                width: 100%;
                height: 50px;
                font-size: 15px;
            }
            .footer {
                gap: 12px;
            }
        }
        @media (max-width: 360px) {
            .error-code {
                font-size: 72px;
            }
            .title {
                font-size: 18px;
            }
            .desc {
                font-size: 13px;
            }
        }
    </style>
    <base target="_blank">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="error-code">404</div>
            <div class="emoji">(´；ω；`)</div>
            <div class="title">这个页面被猴子搬走了</div>
            <div class="desc">
                可能是 Ac 号输错了，也可能是页面真的不存在。<br>
                反正<span class="highlight">认真你就输啦</span>，不如回首页再看看？
            </div>
            <a href="javascript:void(0)" class="btn btn-primary" id="backHomeBtn">返回首页</a>
        </div>

        <div class="footer">
            <span class="version">v0.0.1</span>
            <span class="dot"></span>
            <span class="copyright">Copyright &copy; 2026 乗芷</span>
            <span class="dot"></span>
            <a href="./index.html">AcfunPlus</a>
        </div>
    </div>

    <script>
        document.getElementById('backHomeBtn').addEventListener('click', function() {
            window.location.replace('./index.html');
        });
    </script>
</body>
</html>
